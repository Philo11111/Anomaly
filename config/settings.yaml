# Thresholds, venues and free endpoints. Secrets belong in the environment, not here.
host: "0.0.0.0"
port: 8080
log_level: INFO
webhook_min_level: red
news_max_age_hours: 48
crash_pct: 25

score:
  mint_supply_pct: 5
  mint_points: 50
  drain_pct: 30
  drain_points: 40
  fresh_signer_points: 30
  fresh_nonce_max: 5
  dex_gap_pct: 20
  dex_gap_points: 25
  korean_halt_points: 30
  trusted_source_points: 25
  notice_points: 20
  venue_oi_usd: 500000
  venue_oi_points: 15
  red_day: 60
  red_night: 75
  yellow: 40
  night_start_hour: 0
  night_end_hour: 8
  dedup_hours: 2
  mint_window_seconds: 600

# rate = how many calls are allowed per per_seconds. Weights use the same bucket.
limits:
  default: {rate: 8, per_seconds: 1}
  rpc: {rate: 8, per_seconds: 1}
  hyperliquid: {rate: 1100, per_seconds: 60}
  aster: {rate: 2000, per_seconds: 60}
  lighter: {rate: 50, per_seconds: 60}
  variational: {rate: 8, per_seconds: 10}
  bingx: {rate: 80, per_seconds: 10}
  binance: {rate: 20, per_seconds: 10}
  bybit: {rate: 10, per_seconds: 1}
  okx: {rate: 8, per_seconds: 1}
  mexc: {rate: 8, per_seconds: 1}
  solana: {rate: 40, per_seconds: 10}
  coingecko: {rate: 6, per_seconds: 60}
  defillama: {rate: 8, per_seconds: 10}
  rss: {rate: 1, per_seconds: 2}
  upbit: {rate: 4, per_seconds: 10}
  bitget: {rate: 8, per_seconds: 10}
  bithumb: {rate: 4, per_seconds: 10}
  gate: {rate: 4, per_seconds: 10}

intervals:
  markets_hyperliquid: 15
  markets_aster: 20
  markets_lighter: 20
  markets_variational: 5
  markets_bingx: 20
  markets_bybit: 25
  markets_okx: 25
  markets_binance: 25
  markets_mexc: 30
  hl_meta: 25
  dex_gap: 45
  news_hacks: 180
  news_rss: 180
  registry: 21600
  solana_idle: 30
  notice_upbit: 12
  notice_okx: 30
  notice_bybit: 30
  notice_bitget: 45
  notice_bithumb: 45
  notice_gate: 90
  notice_bingx: 120

user_venues: [hyperliquid, aster, lighter, variational, bingx]
reference_venues: [binance, bybit, okx, mexc]
korean_exchanges: [upbit, bithumb]
trusted_sources: [defillama, rekt, lookonchainchannel, onchainlens, investigations]

keywords:
  incident:
    - exploit
    - exploited
    - hack
    - hacked
    - drained
    - stolen
    - compromised
    - unbacked
    - infinite mint
    - unauthorized
    - vulnerability
    - rug
  deposit_words: ["deposit", "deposits", "입금", "입출금"]
  halt_words: ["suspend", "suspended", "halt", "halted", "중지", "중단", "pause", "paused"]
  reduce_only: ["reduce-only", "reduce only"]
  rollback: ["rollback", "roll back", "reversal", "reverse trades", "reversing", "롤백"]
  security: ["exploit", "hack", "compromised", "unauthorized", "security incident", "vulnerability", "보안사고"]

defillama_hacks: "https://api.llama.fi/hacks"

rss_feeds:
  - "https://rekt.news/feed/"
  - "https://cointelegraph.com/rss"
  - "https://decrypt.co/feed"
  - "https://www.theblock.co/rss.xml"
  - "https://www.coindesk.com/arc/outboundfeeds/rss/"

chains:
  ethereum:
    chain_id: 1
    llama: ethereum
    ws:
      - "wss://ethereum-rpc.publicnode.com"
      - "wss://eth.drpc.org"
    http:
      - "https://ethereum-rpc.publicnode.com"
      - "https://eth.drpc.org"
      - "https://cloudflare-eth.com"
    explorer_tx: "https://etherscan.io/tx/{tx}"
    explorer_address: "https://etherscan.io/address/{address}"
  bsc:
    chain_id: 56
    llama: bsc
    ws:
      - "wss://bsc-rpc.publicnode.com"
    http:
      - "https://bsc-rpc.publicnode.com"
      - "https://bsc-dataseed.binance.org"
      - "https://bsc.api.pocket.network"
      - "https://bsc-mainnet.public.blastapi.io"
    explorer_tx: "https://bscscan.com/tx/{tx}"
    explorer_address: "https://bscscan.com/address/{address}"
  base:
    chain_id: 8453
    llama: base
    ws:
      - "wss://base-rpc.publicnode.com"
    http:
      - "https://base-rpc.publicnode.com"
      - "https://mainnet.base.org"
      - "https://base.drpc.org"
    explorer_tx: "https://basescan.org/tx/{tx}"
    explorer_address: "https://basescan.org/address/{address}"
  arbitrum:
    chain_id: 42161
    llama: arbitrum
    ws:
      - "wss://arbitrum-one-rpc.publicnode.com"
    http:
      - "https://arbitrum-one-rpc.publicnode.com"
      - "https://arb1.arbitrum.io/rpc"
    explorer_tx: "https://arbiscan.io/tx/{tx}"
    explorer_address: "https://arbiscan.io/address/{address}"
  solana:
    chain_id: null
    llama: solana
    ws:
      - "wss://api.mainnet-beta.solana.com"
    http:
      - "https://api.mainnet-beta.solana.com"
    explorer_tx: "https://solscan.io/tx/{tx}"
    explorer_address: "https://solscan.io/account/{address}"

venues:
  hyperliquid:
    info: "https://api.hyperliquid.xyz/info"
    ws: "wss://api.hyperliquid.xyz/ws"
    trade: "https://app.hyperliquid.xyz/trade/{symbol}"
  aster:
    exchange_info: "https://fapi.asterdex.com/fapi/v1/exchangeInfo"
    premium: "https://fapi.asterdex.com/fapi/v1/premiumIndex"
    ticker: "https://fapi.asterdex.com/fapi/v1/ticker/24hr"
    open_interest: "https://fapi.asterdex.com/fapi/v1/openInterest?symbol={symbol}"
    liquidation_ws: "wss://fstream.asterdex.com/ws/!forceOrder@arr"
    trade: "https://www.asterdex.com/en/futures/{symbol}"
  lighter:
    order_books: "https://mainnet.zklighter.elliot.ai/api/v1/orderBookDetails"
    funding: "https://mainnet.zklighter.elliot.ai/api/v1/funding-rates"
    ws: "wss://mainnet.zklighter.elliot.ai/stream"
    trade: "https://app.lighter.xyz/trade/{symbol}"
  variational:
    stats: "https://omni-client-api.prod.ap-northeast-1.variational.io/metadata/v2/stats"
    trade: "https://omni.variational.io/perpetual/{symbol}"
  bingx:
    contracts: "https://open-api.bingx.com/openApi/swap/v2/quote/contracts"
    premium: "https://open-api.bingx.com/openApi/swap/v2/quote/premiumIndex"
    ticker: "https://open-api.bingx.com/openApi/swap/v2/quote/ticker"
    open_interest: "https://open-api.bingx.com/openApi/swap/v2/quote/openInterest?symbol={symbol}"
    # Best-effort. This host rejected the build environment with a device-time error.
    announcements: "https://bingx.com/api/customer/v1/announcement/list?pageId=0&pageSize=20"
    trade: "https://bingx.com/en/perpetual/{symbol}"
  bybit:
    tickers: "https://api.bybit.com/v5/market/tickers?category=linear"
    tickers_failover:
      - "https://api.bytick.com/v5/market/tickers?category=linear"
    announcements: "https://api.bybit.com/v5/announcements/index?locale=en-US&limit=20"
    trade: "https://www.bybit.com/trade/usdt/{symbol}"
  okx:
    open_interest: "https://www.okx.com/api/v5/public/open-interest?instType=SWAP"
    mark: "https://www.okx.com/api/v5/public/mark-price?instType=SWAP"
    funding: "https://www.okx.com/api/v5/public/funding-rate?instId={symbol}"
    announcements: "https://www.okx.com/api/v5/support/announcements"
    trade: "https://www.okx.com/trade-swap/{symbol}"
  binance:
    premium_urls:
      - "https://fapi.binance.com/fapi/v1/premiumIndex"
    open_interest_urls:
      - "https://fapi.binance.com/fapi/v1/openInterest?symbol={symbol}"
    spot_price: "https://data-api.binance.vision/api/v3/ticker/price?symbol=BTCUSDT"
    trade: "https://www.binance.com/en/futures/{symbol}"
  mexc:
    ticker: "https://contract.mexc.com/api/v1/contract/ticker"
    detail: "https://contract.mexc.com/api/v1/contract/detail"
    trade: "https://futures.mexc.com/exchange/{symbol}"
  upbit:
    announcements: "https://api-manager.upbit.com/api/v1/announcements?os=web&page=1&per_page=20"
  bitget:
    announcements: "https://api.bitget.com/api/v2/public/annoucements?language=en_US"
  bithumb:
    notices: "https://api.bithumb.com/v1/notices?count=20"
  gate:
    currencies: "https://api.gateio.ws/api/v4/spot/currencies"
